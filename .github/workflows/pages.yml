name: Deploy web app

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish web/ to gh-pages
        run: |
          cd web
          git init -q -b gh-pages
          git config user.name "say-what-ci"; git config user.email "ci@users.noreply.github.com"
          touch .nojekyll
          git add . && git commit -qm "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
