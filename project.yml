# XcodeGen spec — run `xcodegen` to (re)generate SayWhat.xcodeproj.
# CI regenerates and commits the project automatically, so you can also just open SayWhat.xcodeproj.
name: SayWhat
options:
  bundleIdPrefix: com.afonsopedroso
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.1.0
  SayWhatKit:
    path: Packages/SayWhatKit

targets:
  SayWhat:
    type: application
    platform: iOS
    sources:
      - path: iOS/App
      - path: Shared
    dependencies:
      - package: SayWhatKit
      - package: WhisperKit
        product: WhisperKit
      - target: SayWhatKeyboard
        embed: true
    entitlements:
      path: iOS/App/SayWhat.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.afonsopedroso.saywhat
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Say What
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Say What listens while you dictate and turns your voice into text — on this iPhone by default.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.afonsopedroso.saywhat
            CFBundleURLSchemes: [saywhat]
    settings:
      base:
        PRODUCT_NAME: SayWhat
        PRODUCT_BUNDLE_IDENTIFIER: com.afonsopedroso.saywhat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}

  SayWhatKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/Keyboard
    dependencies:
      - package: SayWhatKit
    entitlements:
      path: iOS/Keyboard/SayWhatKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.afonsopedroso.saywhat
    info:
      path: iOS/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Say What
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            RequestsOpenAccess: true
            PrimaryLanguage: en-US
            IsASCIICapable: false
            PrefersRightToLeft: false
    settings:
      base:
        PRODUCT_NAME: SayWhatKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: com.afonsopedroso.saywhat.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

  SayWhatMac:
    type: application
    platform: macOS
    sources:
      - path: macOS
      - path: Shared
    dependencies:
      - package: SayWhatKit
      - package: WhisperKit
        product: WhisperKit
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Say What
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Say What listens while you hold the hotkey and types what you say.
    settings:
      base:
        PRODUCT_NAME: Say What
        PRODUCT_BUNDLE_IDENTIFIER: com.afonsopedroso.saywhat.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signs to run locally — no Apple account needed for the Mac app.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ARCHS: arm64
    scheme: {}
